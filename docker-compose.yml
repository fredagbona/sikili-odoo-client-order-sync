services:
  app-db:
    image: postgres:16
    container_name: sikili_app_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: sikili_sync
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d sikili_sync"]
      interval: 3s
      timeout: 5s
      retries: 15

  odoo-db:
    image: postgres:16
    container_name: sikili_odoo_db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo_db_data:/var/lib/postgresql/data

  odoo:
    image: odoo:18
    container_name: sikili_odoo
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sikili_api
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    depends_on:
      app-db:
        condition: service_healthy
      odoo:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: sikili_web
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  app_db_data:
  odoo_db_data:
  odoo_data:
